# =============================================================================
# scripts/cloudbuild-init-db.yaml — Config Cloud Build per init database
#
# Invoca scripts/init_db_cloudbuild.sh in un container Linux su Google Cloud.
# Zero dipendenze locali: serve solo gcloud.
#
# Invocazione automatica: terraform apply (null_resource.init_db in main.tf)
# Invocazione manuale:
#   gcloud builds submit . \
#     --config=scripts/cloudbuild-init-db.yaml \
#     --project=bt-platform-prod
# =============================================================================

steps:
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: init-database
    entrypoint: bash
    # Le variabili Cloud Build (${_VAR}, ${PROJECT_ID}) vengono espanse qui
    # e passate allo script come variabili d'ambiente bash normali.
    env:
      - 'PROJECT_ID=${PROJECT_ID}'
      - 'DB_NAME=${_DB_NAME}'
      - 'REGION=${_REGION}'
      - 'INSTANCE=${_INSTANCE}'
      - 'SECRET_NAME=${_SECRET_NAME}'
    args:
      - '/workspace/scripts/init_db_cloudbuild.sh'

# ─── Parametri di default ─────────────────────────────────────────────────────
substitutions:
  _REGION: europe-west8
  _INSTANCE: bt-platform-pg-prod
  _DB_NAME: db_bt_platform
  _SECRET_NAME: bt-platform-db-postgres-password-prod

options:
  # LEGACY: i log vanno sia su Cloud Logging sia su GCS.
  # Necessario per visualizzare i log in tempo reale nel terminale con
  # "gcloud builds submit" (CLOUD_LOGGING_ONLY non mostra i log nel terminale).
  logging: LEGACY
